<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercicíos de JS</title>
    </head>

    <body>
        <div class="tudo">

            <h1>Vamos Calcular!</h1>
            <h3>Exercícios de JavaScript</h3>

            <div class="nome">
                <h2>Qual é o seu nome?</h2>
                <input type="text" id="nome" name="nome">

                <button id="mostrar">Mostrar Nome</button>

                <h2 id="resultadodonome"></h2>
            </div>

            <div class="Operaçoes">

                <div class="soma">
                    <h2>Vamos de soma?</h2>

                    <h4>Digite o primeiro número:</h4>  

                    <input type="number" id="num1" name="num1">

                    <h4>Digite o segundo número:</h4>

                    <input type="number" id="num2" name="num2">

                    <button id="somar">Cacule!</button>

                    <h4 id="resultadodasoma"></h4>
                </div>

                <div class="subtraçao">
                    <h2>Vamos de subtração?</h2>

                    <h4>Digite o primeiro número:</h4>

                    <input type="number" id="num3" name="num3">
                    
                    <h4>Digite o segundo número:</h4>

                    <input type="number" id="num4" name="num4">

                    <button id="subtrair">Vejamos!</button>

                    <h4 id="resultadodasubtração"></h4>
                </div>
                    
            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
